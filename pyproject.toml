[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Narrow ruleset for CI bootstrap — broader lint cleanup tracked separately.
# F541: f-string with no placeholders (auto-fixable, genuine bugs)
# E9xx: syntax/runtime errors
# Ignoring import-sort (I), unused-import (F401), star-import (F403/F405),
# unused-var (F841), and style rules until a dedicated cleanup PR.
select = ["E9", "F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=modules --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
omit = ["tests/*", "*/migrations/*"]
