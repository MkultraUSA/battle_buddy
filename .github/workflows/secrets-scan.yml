name: secrets-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks via apt/brew fallback
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}"
          # Try direct download with retries
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            if curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/${TARBALL}" "${URL}"; then
              tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
              sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
              gitleaks version
              exit 0
            fi
            sleep 15
          done
          # Fallback: install via go install
          echo "Direct download failed, installing via go..."
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          sudo mv "$(go env GOPATH)/bin/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository
        run: gitleaks detect --source . --redact --verbose --exit-code 1
