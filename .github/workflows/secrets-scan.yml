name: secrets-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          for i in 1 2 3; do
            if curl -fsSL -o "/tmp/${TARBALL}" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}"; then
              break
            fi
            echo "Download attempt $i failed, retrying in 10s..."
            sleep 10
          done
          tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository
        run: gitleaks detect --source . --redact --verbose --exit-code 1
