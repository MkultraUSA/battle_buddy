name: System - Persistent Hermes Workspace Fix
on:
  workflow_dispatch:

jobs:
  workspace_fix:
    name: Persist Hermes Port 3001
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Surgical Compose Update
        env:
          TARGET_HOST: ${{ secrets.HOSTINGER_HOST }}
          TARGET_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$TARGET_USER@$TARGET_HOST" "bash -s" << 'EOF'
            set -euo pipefail
            FILE=$(find / -name docker-compose.yml 2>/dev/null | xargs grep -l 'hermes' | head -n 1)
            [ -z "$FILE" ] && echo "No compose found" && exit 1
            echo "Updating $FILE"
            
            # Simple, reliable sed for standard hermes service blocks
            # This ensures 3001:3000 mapping and HOST=0.0.0.0
            
            # 1. Add ports if not present
            if ! grep -q "3001:3000" "$FILE"; then
              sed -i "/hermes:/,/volumes:/ s/image:.*/&\n    ports:\n      - \"3001:3000\"/" "$FILE"
            fi
            
            # 2. Add environment if not present
            if ! grep -q "HOST=0.0.0.0" "$FILE"; then
              sed -i "/hermes:/,/volumes:/ s/image:.*/&\n    environment:\n      - HOST=0.0.0.0\n      - PORT=3000/" "$FILE"
            fi
            
            cd $(dirname "$FILE") && docker compose up -d
            iptables -I INPUT -p tcp --dport 3001 -j ACCEPT || true
            ufw allow 3001/tcp || true
          EOF
