name: BB Pipeline
on:
  workflow_dispatch:

jobs:
  debug_logs:
    name: Check Hermes Container Logs
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Get Docker Logs
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" "
            echo '=== CONTAINER STATUS ==='
            docker ps -a | grep hermes
            echo '=== RECENT LOGS ==='
            docker logs --tail 100 hermes
            echo '=== NETWORK LISTENING ==='
            docker exec hermes netstat -tulpn || docker exec hermes ss -tulpn || echo 'Neither netstat nor ss found in container'
          "
