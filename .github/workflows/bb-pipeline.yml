name: BB Pipeline
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Goal'
        required: true
        type: string

jobs:
  coder:
    name: Hermes coder - open PR
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Execute System Task
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          TASK: ${{ inputs.task }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" "
            echo 'Searching for docker-compose.yml...'
            COMPOSE_PATH=\$(find / -name docker-compose.yml 2>/dev/null | xargs grep -l 'hermes' | head -n 1)
            if [ -z \"\$COMPOSE_PATH\" ]; then
              echo 'Error: Could not find docker-compose.yml'
              exit 1
            fi
            echo \"Found compose file at: \$COMPOSE_PATH\"
            
            # Use sed to ensure 3001:3000 mapping exists for hermes
            # This looks for the hermes service and adds/updates the ports
            sed -i '/hermes:/,/ports:/ s/- \"[0-9]*:3000\"/- \"3001:3000\"/' \"\$COMPOSE_PATH\"
            
            echo 'Restarting services...'
            cd \$(dirname \"\$COMPOSE_PATH\") && docker compose up -d
            echo 'Done.'
          "
