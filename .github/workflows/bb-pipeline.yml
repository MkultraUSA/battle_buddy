name: BB Pipeline
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Goal'
        required: true
        type: string

jobs:
  coder:
    name: Hermes coder - open PR
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.extract.outputs.pr_url }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Preflight SSH access
        env:
          TARGET_HOST: ${{ secrets.VPS_HOST }}
          TARGET_USER: root
        run: |
          set -euo pipefail
          test -n "${TARGET_HOST}" || (echo "Missing secret: VPS_HOST" && exit 1)
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${TARGET_USER}@${TARGET_HOST}" "hostname && date +%F_%T"

      - name: Write task and token to Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.VPS_HOST }}
          HOSTINGER_USER: root
          WORKER_GH_TOKEN: ${{ secrets.WORKER_GH_TOKEN }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          printf 'GITHUB_TOKEN="%s"\n' "${WORKER_GH_TOKEN}" > /tmp/worker.env
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 /tmp/worker.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/hermes-data/.worker.env"
          printf '%s\n' "${TASK}" > /tmp/hermes_task.txt
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 /tmp/hermes_task.txt "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/hermes-data/hermes_task.txt"

      - name: Trigger Coder via tmux
        env:
          HOSTINGER_HOST: ${{ secrets.VPS_HOST }}
          HOSTINGER_USER: root
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" "tmux send-keys -t hermes-ci C-c" || true
          sleep 2
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "tmux send-keys -t hermes-ci 'docker exec -it -u hermes --env-file /opt/hermes-data/.worker.env -e HOME=/opt/data/home hermes /opt/hermes/.venv/bin/hermes chat --yolo --accept-hooks -q \"I need to work on the Battle Buddy codebase in /opt/data/workspace/battle_buddy/. Please read /opt/data/hermes_task.txt and execute the requested improvement. This task requires the Coder -> Reviewer -> PR -> Merge -> Deploy -> Post-Deploy Tests pipeline. Steps: 1) Plan the change 2) Implement in a feature branch 3) Open a PR 4) Perform adversarial code review (delegate to independent reviewer) 5) Fix any issues found 6) Re-review until approved 7) Merge the PR 8) Deploy to production by merged SHA ONLY (no git pull): ssh root@kevcloud.ddns.net \\\"cd /opt/battlebuddy && git fetch origin main && git checkout main && git reset --hard <MERGED_SHA> && systemctl restart battlebuddy\\\" 9) Verify health (systemctl is-active battlebuddy) 10) Run post-deploy tests. Mandatory anti-blocker rules: if lint/tests fail, commit fixes to same branch and continue; if deploy drift/dirty tree detected, stop deploy and report exact git status/sha; if transient API/rate-limit errors happen, retry with backoff and continue from last step. Do NOT skip review or post-deploy tests. Before opening a PR, install dev requirements from requirements-dev.txt, run python -m ruff check . --fix, then run python -m ruff check . and relevant tests. Commit any Ruff fixes with the work. End with one machine-parseable line: BOT_RESULT:SUCCESS PR=<url> SHA=<sha> DEPLOYED_SHA=<sha> or BOT_RESULT:BLOCKED REASON=<reason> STEP=<step>.\"' Enter"

      - name: Poll tmux for PR URL
        id: extract
        env:
          HOSTINGER_HOST: ${{ secrets.VPS_HOST }}
          HOSTINGER_USER: root
        run: |
          set -euo pipefail
          # Poll for 30 minutes
          DEADLINE=$(( $(date +%s) + 30*60 ))
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            sleep 30
            PANE=$(ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" "tmux capture-pane -t hermes-ci -p -S -500" || true)
            PR_URL=$(printf '%s' "${PANE}" | grep -oE 'https://github\.com/MkultraUSA/battle_buddy/pull/[0-9]+' | tail -1 || true)
            if [ -n "${PR_URL}" ]; then
              echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1

  reviewer:
    name: Hermes reviewer - critique and approve PR
    runs-on: ubuntu-latest
    needs: coder
    outputs:
      approved: ${{ steps.review.outputs.approved }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Write reviewer task to Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.VPS_HOST }}
          HOSTINGER_USER: root
          WORKER_GH_TOKEN: ${{ secrets.WORKER_GH_TOKEN }}
          PR_URL: ${{ needs.coder.outputs.pr_url }}
        run: |
          cat > /tmp/hermes_task.txt <<EOF
          You are the adversarial code reviewer for Battle Buddy.
          1. Find the PR: ${PR_URL}
          2. Inspect the diff thoroughly — check correctness, edge cases, regressions, production safety, code style
          3. If Ruff failed, install dev requirements from requirements-dev.txt, fix the branch with python -m ruff check . --fix, rerun python -m ruff check ., and push the fix
          4. If you find issues, request changes with specific fix instructions
          5. If the PR passes review, approve it and then MERGE it (squash merge)
          6. After merging, verify the merge was successful
          7. Print REVIEW_APPROVED on its own line when done
          8. If rejected, print REVIEW_REJECTED with exact blocking reason and file:line
          EOF
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 /tmp/hermes_task.txt "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/hermes-data/hermes_task.txt"
          printf 'GITHUB_TOKEN="%s"\n' "${WORKER_GH_TOKEN}" > /tmp/worker.env
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 /tmp/worker.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/hermes-data/.worker.env"

      - name: Trigger Reviewer via tmux
        env:
          HOSTINGER_HOST: ${{ secrets.VPS_HOST }}
          HOSTINGER_USER: root
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" "tmux send-keys -t hermes-ci C-c" || true
          sleep 2
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "tmux send-keys -t hermes-ci 'docker exec -it -u hermes --env-file /opt/hermes-data/.worker.env -e HOME=/opt/data/home hermes /opt/hermes/.venv/bin/hermes chat --yolo --accept-hooks -q \"Read /opt/data/hermes_task.txt and perform the PR review, merge, and verification now.\" ' Enter"

      - name: Poll for review result
        id: review
        env:
          HOSTINGER_HOST: ${{ secrets.VPS_HOST }}
          HOSTINGER_USER: root
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 20*60 ))
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            sleep 30
            PANE=$(ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" "tmux capture-pane -t hermes-ci -p -S -500" || true)
            if printf '%s' "${PANE}" | grep -q "REVIEW_APPROVED"; then
              echo "approved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if printf '%s' "${PANE}" | grep -q "REVIEW_REJECTED"; then
              echo "approved=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done
          exit 1
