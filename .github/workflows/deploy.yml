name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy to production VPS
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Deploy and health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/battlebuddy
            git pull --ff-only
            systemctl restart battlebuddy
            sleep 5
            systemctl is-active battlebuddy || (git revert HEAD --no-edit && systemctl restart battlebuddy && exit 1)
