name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy to production VPS
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Deploy and health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/battlebuddy
            git fetch origin main
            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: server drift detected (dirty working tree)"
              git status --short
              exit 1
            fi
            git checkout main
            git reset --hard "${{ github.sha }}"
            /opt/battlebuddy/venv/bin/pip install -r requirements.txt -q
            systemctl restart battlebuddy
            sleep 5
            systemctl is-active battlebuddy
            test -z "$(git status --porcelain)"

      - name: Notify Telegram — success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Battle Buddy deployed successfully%0A${{ github.event.head_commit.message }}"

      - name: Notify Telegram — failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Battle Buddy deploy FAILED%0A${{ github.event.head_commit.message }}%0ASee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  smoke-test:
    name: post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install pytest requests -q

      - name: Run smoke tests
        id: smoke
        run: |
          pytest tests/test_smoke.py -v --tb=short --override-ini="addopts=" 2>&1 | tee /tmp/smoke_results.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          SMOKE_TEST_BASE_URL: https://battlebuddy.new
          PYTEST_ADDOPTS: ""

      - name: Notify Telegram — smoke tests passed
        if: steps.smoke.outputs.exit_code == '0'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Smoke tests passed after deploy%0A${{ github.event.head_commit.message }}"

      - name: Notify Telegram — smoke tests FAILED
        if: steps.smoke.outputs.exit_code != '0'
        run: |
          RESULTS=$(cat /tmp/smoke_results.txt | tail -20 | sed 's/[&<>]/\\&/g')
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Smoke tests FAILED after deploy%0A${{ github.event.head_commit.message }}%0A%0A${RESULTS}"
