name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy to production VPS
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Deploy and health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/battlebuddy
            git fetch origin main
            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: server drift detected (dirty working tree)"
              git status --short
              exit 1
            fi
            git checkout main
            git reset --hard "${{ github.sha }}"
            /opt/battlebuddy/venv/bin/pip install -r requirements.txt -q
            systemctl restart battlebuddy
            sleep 5
            systemctl is-active battlebuddy
            test -z "$(git status --porcelain)"

      # The commit message is arbitrary text controlled by whoever pushed, so it
      # is never interpolated into the script. A backtick in a commit message
      # used to become a shell command substitution here: merging a message that
      # mentioned write_text made bash run `write_text: command not found`,
      # exit non-zero, and fire a "deploy FAILED" page for a deploy that had
      # just succeeded and already sent its success page. Passing the message
      # through the environment and using --data-urlencode means no shell ever
      # parses it, and newlines, quotes and ampersands survive intact.
      - name: Notify Telegram — success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Telegram caps a message at 4096 characters and answers 400 beyond
          # it. Now that the whole commit body survives quoting intact, a long
          # body silently dropped the alert -- and curl still exits 0, so the
          # step passed and CI stayed green while no page ever arrived. Cap the
          # body, and fail the step if Telegram rejects the send, so a lost
          # alert is visible instead of invisible.
          MSG="${COMMIT_MESSAGE:0:3600}"
          if [ "${#COMMIT_MESSAGE}" -gt 3600 ]; then MSG="${MSG}... (truncated)"; fi
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Battle Buddy deployed successfully
          ${MSG}")
          case "$RESPONSE" in
            *'"ok":true'*) ;;
            *) echo "telegram_send FAILED: $RESPONSE" >&2; exit 1 ;;
          esac

      - name: Notify Telegram — failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="${COMMIT_MESSAGE:0:3600}"
          if [ "${#COMMIT_MESSAGE}" -gt 3600 ]; then MSG="${MSG}... (truncated)"; fi
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Battle Buddy deploy FAILED
          ${MSG}
          See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          case "$RESPONSE" in
            *'"ok":true'*) ;;
            *) echo "telegram_send FAILED: $RESPONSE" >&2; exit 1 ;;
          esac

  smoke-test:
    name: post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install pytest requests -q

      - name: Run smoke tests
        id: smoke
        run: |
          pytest tests/test_smoke.py -v --tb=short --override-ini="addopts=" 2>&1 | tee /tmp/smoke_results.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          # .news, not .new. The typo meant this job pointed at a domain that
          # does not resolve, so the smoke test was validating nothing while
          # reporting itself as a real post-deploy check.
          SMOKE_TEST_BASE_URL: https://battlebuddy.news
          PYTEST_ADDOPTS: ""

      - name: Notify Telegram — smoke tests passed
        if: steps.smoke.outputs.exit_code == 0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="${COMMIT_MESSAGE:0:3600}"
          if [ "${#COMMIT_MESSAGE}" -gt 3600 ]; then MSG="${MSG}... (truncated)"; fi
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Smoke tests passed after deploy
          ${MSG}")
          case "$RESPONSE" in
            *'"ok":true'*) ;;
            *) echo "telegram_send FAILED: $RESPONSE" >&2; exit 1 ;;
          esac

      - name: Notify Telegram — smoke tests FAILED
        if: steps.smoke.outputs.exit_code != 0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RESULTS=$(tail -20 /tmp/smoke_results.txt)
          MSG="${COMMIT_MESSAGE:0:3000}"
          if [ "${#COMMIT_MESSAGE}" -gt 3000 ]; then MSG="${MSG}... (truncated)"; fi
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Smoke tests FAILED after deploy
          ${MSG}

          ${RESULTS}")
          case "$RESPONSE" in
            *'"ok":true'*) ;;
            *) echo "telegram_send FAILED: $RESPONSE" >&2; exit 1 ;;
          esac

  ops-verify:
    name: post-deploy SLO verification
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - name: Run SLO gates on production
        id: ops
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/battlebuddy
            ./venv/bin/python scripts/ops_verify.py 2>&1 | tee /tmp/ops_verify.txt
            test ${PIPESTATUS[0]} -eq 0

      - name: Notify Telegram — SLOs green
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="${COMMIT_MESSAGE:0:3600}"
          if [ "${#COMMIT_MESSAGE}" -gt 3600 ]; then MSG="${MSG}... (truncated)"; fi
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Post-deploy SLOs green (19 gates)
          ${MSG}")
          case "$RESPONSE" in
            *'"ok":true'*) ;;
            *) echo "telegram_send FAILED: $RESPONSE" >&2; exit 1 ;;
          esac

      - name: Notify Telegram — SLO BREACH
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="${COMMIT_MESSAGE:0:3600}"
          if [ "${#COMMIT_MESSAGE}" -gt 3600 ]; then MSG="${MSG}... (truncated)"; fi
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 Post-deploy SLO BREACH — check Grafana Ops board
          ${MSG}

          See: ${RUN_URL}")
          case "$RESPONSE" in
            *'"ok":true'*) ;;
            *) echo "telegram_send FAILED: $RESPONSE" >&2; exit 1 ;;
          esac
