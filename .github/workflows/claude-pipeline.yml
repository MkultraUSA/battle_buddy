# Claude Pipeline — workflow_dispatch enabled (re-indexed 2026-05-02)
name: Claude Pipeline

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Plain-English description of what to build/change'
        required: true
        type: string
      branch:
        description: 'Feature branch name (auto-generated from task if blank)'
        required: false
        type: string
        default: ''

concurrency:
  group: claude-pipeline
  cancel-in-progress: false

jobs:
  coder:
    name: Hermes coder - open PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pr_url: ${{ steps.extract.outputs.pr_url }}
    steps:
      - name: Compute branch slug
        id: slug
        env:
          TASK: ${{ inputs.task }}
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ -n "${BRANCH_INPUT}" ]; then
            BRANCH="${BRANCH_INPUT}"
          else
            SLUG=$(printf '%s' "${TASK}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-' | cut -c1-40 | sed 's/-*$//')
            [ -z "${SLUG}" ] && SLUG="hermes-task-${GITHUB_RUN_ID}"
            BRANCH="feature/${SLUG}"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write coder task and token to Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          WORKER_GH_TOKEN: ${{ secrets.WORKER_GH_TOKEN }}
          TASK: ${{ inputs.task }}
          BRANCH: ${{ steps.slug.outputs.branch }}
        run: |
          set -euo pipefail
          # Deliver token via file — never inline in tmux send-keys
          printf 'GITHUB_TOKEN="%s"\n' "${WORKER_GH_TOKEN}" > /tmp/worker.env
          scp -i ~/.ssh/id_ed25519 /tmp/worker.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/hermes-data/.worker.env"
          cat > /tmp/hermes_task.txt <<HEREDOC
You are making code changes to the Battle Buddy codebase.
Workspace: /opt/data/workspace/battle_buddy/

STEP 1 - Sync workspace:
  cd /opt/data/workspace/battle_buddy
  git checkout main && git fetch origin && git reset --hard origin/main
  git checkout -b ${BRANCH}

STEP 2 - Make the changes described below:
----- TASK BEGIN -----
${TASK}
----- TASK END -----

STEP 3 - Verify each Python file you changed:
  python3 -m py_compile <changed .py files>
  /opt/hermes/.venv/bin/ruff check <changed .py files> --select E,F,I
Fix all errors before continuing.

STEP 4 - Commit and push:
  git add <changed files>
  git commit -m "<short imperative subject>"
  Check: git log -1 -- if Co-Authored-By appears, amend: git commit --amend --no-edit
  git push origin ${BRANCH}

STEP 5 - Open PR:
  gh pr create --title "<title>" --body "<body>" --base main --head ${BRANCH}
  Print the PR URL on its own line: https://github.com/MkultraUSA/battle_buddy/pull/<N>

RULES:
- Never add Co-Authored-By lines to commits.
- gh is already authenticated -- never run gh auth login or gh auth switch.
- ruff binary: /opt/hermes/.venv/bin/ruff
HEREDOC
          scp -i ~/.ssh/id_ed25519 /tmp/hermes_task.txt "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/hermes-data/hermes_task.txt"

      - name: Send coder task to Hermes via tmux
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" "tmux send-keys -t hermes-ci C-c" || true
          sleep 2
          ssh -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "tmux send-keys -t hermes-ci 'docker exec -it -u hermes --env-file /opt/hermes-data/.worker.env -e HOME=/opt/data/home hermes /opt/hermes/.venv/bin/hermes chat --yolo --accept-hooks -q \"Read /opt/data/hermes_task.txt and follow all instructions exactly.\"' Enter"

      - name: Poll tmux for PR URL
        id: extract
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 20*60 ))
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            sleep 30
            PANE=$(ssh -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
              "tmux capture-pane -t hermes-ci -p -S -500" || true)
            printf '%s\n' "${PANE}" | tail -20
            PR_URL=$(printf '%s' "${PANE}" | grep -oE 'https://github\.com/MkultraUSA/battle_buddy/pull/[0-9]+' | tail -1 || true)
            if [ -n "${PR_URL}" ]; then
              echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
              echo "PR: ${PR_URL}"
              exit 0
            fi
          done
          echo "Timeout: Hermes did not open a PR within 20 minutes" >&2
          exit 1

      - name: Notify Telegram - coder done
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Hermes coder opened PR: ${{ steps.extract.outputs.pr_url }}"

      - name: Notify Telegram - coder failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Hermes coder FAILED: ${{ inputs.task }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  reviewer:
    name: Hermes reviewer - critique PR
    runs-on: ubuntu-latest
    needs: coder
    timeout-minutes: 15
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write reviewer task to Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          PR_URL: ${{ needs.coder.outputs.pr_url }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          cat > /tmp/hermes_task.txt <<HEREDOC
You are bb-reviewer. Review the pull request and decide to approve or request changes. Do not merge.

PR: ${PR_URL}

STEP 1 - Switch gh to reviewer account:
  gh auth switch --user Radics

STEP 2 - Inspect the PR:
  gh pr view ${PR_URL}
  gh pr diff ${PR_URL}
  gh pr checks ${PR_URL}
  Wait for all checks to pass. If secrets-scan or python-syntax fail, request changes.

STEP 3 - Checklist:
  - No secrets in diff (sk-, api_key, password=, token=, Bearer, long base64)
  - No .env file changes
  - Base is main, head is feature/*
  - DB path is /opt/battlebuddy/calls.db not incidents.db
  - Scope matches PR title, no unrelated changes
  - No .bakN files added

STEP 4 - Post review:
  APPROVE: gh pr review ${PR_URL} --approve --body "LGTM -- CI green, checklist passed."
  REJECT:  gh pr review ${PR_URL} --request-changes --body "<numbered findings with file:line>"

STEP 5 - Notify Kevin via Telegram:
  If approved:
    curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" -d text="bb-reviewer APPROVED ${PR_URL} -- ready to merge"
  If rejected:
    curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" -d text="bb-reviewer requested changes on ${PR_URL}"

When finished, print the literal line: REVIEW_COMPLETE
HEREDOC
          scp -i ~/.ssh/id_ed25519 /tmp/hermes_task.txt "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/hermes-data/hermes_task.txt"

      - name: Send reviewer task to Hermes via tmux
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          # No GITHUB_TOKEN injection - Hermes uses stored Radics credentials via gh auth switch
          ssh -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" "tmux send-keys -t hermes-ci C-c" || true
          sleep 2
          ssh -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "tmux send-keys -t hermes-ci 'docker exec -it -u hermes -e HOME=/opt/data/home hermes /opt/hermes/.venv/bin/hermes chat --yolo --accept-hooks -q \"Read /opt/data/hermes_task.txt and follow all instructions exactly.\"' Enter"

      - name: Poll tmux for review completion
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 10*60 ))
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            sleep 30
            PANE=$(ssh -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
              "tmux capture-pane -t hermes-ci -p -S -500" || true)
            printf '%s\n' "${PANE}" | tail -20
            if printf '%s' "${PANE}" | grep -q 'REVIEW_COMPLETE'; then
              echo "Reviewer finished."
              exit 0
            fi
          done
          echo "Reviewer timeout after 10 minutes" >&2
          exit 1

      - name: Notify Telegram - reviewer failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Hermes reviewer FAILED on PR: ${{ needs.coder.outputs.pr_url }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
